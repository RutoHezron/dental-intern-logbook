# Supabase CLI configuration for local development (`npx supabase start`).
# Requires Docker. Values not listed here use the CLI defaults.

project_id = "dental-intern-logbook"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Local email testing: codes sent by the app appear here.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 900
